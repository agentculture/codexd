# SonarCloud project identity.
sonar.projectKey=agentculture_codexd
sonar.organization=agentculture

# Source layout: package lives at the top level, without a src wrapper.
sonar.sources=codexd
sonar.tests=tests

# Produced by `uv run pytest --cov-report=xml:coverage.xml`.
sonar.python.coverage.reportPaths=coverage.xml
sonar.python.version=3.12
sonar.coverage.exclusions=codexd/__main__.py

sonar.exclusions=**/__pycache__/**,**/.venv/**,**/.git/**,**/uv.lock,LICENSE
