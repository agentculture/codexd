[project]
name = "codexd"
version = "0.1.3"
description = "Codex daemon for delegated repo tasks and reviewable PRs."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{name = "AgentCulture"}]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Topic :: Software Development",
    "Intended Audience :: Developers",
]
dependencies = [
    "pyyaml>=6.0",
    "agentirc-cli>=9.6,<10",
    "opentelemetry-api>=1.25",
    "opentelemetry-sdk>=1.25",
    "opentelemetry-exporter-otlp-proto-grpc>=1.25",
    "opentelemetry-semantic-conventions>=0.46b0",
    "opentelemetry-instrumentation-aiohttp-server>=0.46b0",
]

[project.urls]
Homepage = "https://github.com/agentculture/codexd"
Issues = "https://github.com/agentculture/codexd/issues"

[project.scripts]
codexd = "codexd.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["codexd"]


[tool.hatch.build.targets.wheel.force-include]
"codexd/agent/culture.yaml" = "codexd/agent/culture.yaml"
"codexd/agent/skill/SKILL.md" = "codexd/agent/skill/SKILL.md"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.25",
    "pytest-xdist>=3.0",
    "pytest-cov>=4.1",
    "bandit>=1.7.5",
    "flake8>=6.1",
    "isort>=5.12.0",
    "black>=23.7.0",
]

[tool.coverage.run]
source = ["codexd"]
omit = [
    "codexd/__pycache__/*",
    "codexd/__main__.py",
    "codexd/agent/skill/irc_client.py",
    "codexd/agent/agent_runner.py",
    "codexd/agent/daemon.py",
    "codexd/agent/supervisor.py",
    "codexd/harness/base_daemon.py",
    "codexd/harness/ipc.py",
    "codexd/harness/irc_transport.py",
    "codexd/harness/queued_base_daemon.py",
    "codexd/harness/skill_irc_client.py",
    "codexd/harness/socket_server.py",
    "codexd/harness/supervisor.py",
    "codexd/harness/telemetry.py",
    "codexd/harness/webhook.py",
]

[tool.coverage.report]
fail_under = 95
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.",
    "if TYPE_CHECKING:",
]

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["codexd"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.bandit]
exclude_dirs = ["tests"]
skips = [
    "B101",
    "B110",
    "B310",
    "B404",
    "B603",
    "B607",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
